description: STM8 counter and capture/compare channels
compatible: "st,stm8-counter"
include: [base.yaml, pinctrl-device.yaml]
properties:
  "#counter-capture-cells":
    type: int
    required: true
    const: 2
counter-capture-cells:
  - channel
  - flags
