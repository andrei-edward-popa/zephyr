description: STM8 TIM1, TIM2, TIM3 or TIM4 timer register block
compatible: "st,stm8-timer"
include: base.yaml
properties:
  reg:
    required: true
  interrupts:
    required: true
  clocks:
    required: true
  st,timer-id:
    type: int
    required: true
    enum: [1, 2, 3, 4]
  st,prescaler:
    type: int
    default: 64
    description: Clock divisor (1 to 65536 for TIM1; a power of two for TIM2 through TIM4)
  st,system-timer:
    type: boolean
    description: Reserve this instance for the system clock rather than the counter API
