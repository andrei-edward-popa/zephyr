# Fit the shell commands, help and terminal editing in 64 KiB of flash with LTO.
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_STACK_SIZE=1280
CONFIG_MAIN_STACK_SIZE=512
CONFIG_SHELL_HELP=y
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_LTO=y
CONFIG_CBPRINTF_NANO=y
CONFIG_LOG=n
CONFIG_LOG_CMDS=n
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=n
CONFIG_STATS=n
CONFIG_STATS_SHELL=n
CONFIG_THREAD_NAME=n
CONFIG_THREAD_MONITOR=n
CONFIG_TIMESLICING=n
CONFIG_BOOT_BANNER=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=n
