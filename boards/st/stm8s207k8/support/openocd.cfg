source [find interface/stlink-dap.cfg]

if { [info exists _ZEPHYR_BOARD_SERIAL] } {
	adapter serial $_ZEPHYR_BOARD_SERIAL
}

set CHIPNAME stm8s207k8
set FLASHSTART 0x8000
set FLASHEND 0x17fff
set EEPROMSTART 0x4000
set EEPROMEND 0x43ff
set WORKAREASIZE 0x400

source [find target/stm8s.cfg]

# Preserve CC changes and the interrupt state captured by irq_lock() when stepping.
$_TARGETNAME configure -enable_step_irq

# ST-Link cannot reliably enter SWIM while the CPU is in Wait mode.
# Connecting under reset also recovers sessions interrupted while NRST is low.
reset_config srst_only srst_nogate connect_assert_srst

$_TARGETNAME configure -event gdb-attach {
	# Reset stalls in the ROM debug module, before fetching the reset vector.
	reg pc 0x8000
}

# SWIM_DM survives pin reset and stalls the CPU at the next reset vector.
# Only SRST with SWIM_CSR.RST set releases the debug module (UM0470).
# Reset on shutdown so the application and reset button work without a probe.
# Set this before init to retain a debug session's state after shutdown.
if { ![info exists STM8_KEEP_DEBUG_STATE] } {
	set STM8_KEEP_DEBUG_STATE 0
}

proc stm8s207k8_shutdown {} {
	global _TARGETNAME STM8_KEEP_DEBUG_STATE

	if { $STM8_KEEP_DEBUG_STATE || [$_TARGETNAME curstate] eq "unknown" } {
		return
	}
	poll off
	halt
	# Retain HS; set SWIM_DM and RST; clear SAFE_MASK and OSCOFF.
	set csr [lindex [read_memory 0x7f80 8 1] 0]
	write_memory 0x7f80 8 [list [expr { ($csr & 0x10) | 0x24 }]]
	# Force the SWIM SRST path instead of a pin reset. Do not access DM afterwards.
	reset_config none
	$_TARGETNAME arp_reset assert 0
}

lappend pre_shutdown_commands stm8s207k8_shutdown
